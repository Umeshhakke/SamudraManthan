<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Autonomous Ocean Bot</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; background:#020617; color:white; font-family:Arial }
#map { height:80vh }
.panel { padding:10px; display:flex; gap:6px }
input,button { padding:6px; border-radius:5px; border:none }
button { background:#0ea5e9; cursor:pointer }
</style>
</head>

<body>

<div class="panel">
  <input id="lat" placeholder="Latitude (Ocean)">
  <input id="lng" placeholder="Longitude (Ocean)">
  <button onclick="addPoint()">Add Waypoint</button>
  <button onclick="startMission()">Start Mission</button>
</div>

<div id="map"></div>
<div id="status">Status: IDLE</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================= CONFIG ================= */
const BASE = [13.0000, 85.0000]; // Bay of Bengal base

/* ================= MAP ================= */
const map = L.map('map').setView(BASE, 6);

/* === OCEAN TILES === */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

/* === SEA MARKS === */
L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png').addTo(map);

/* ================= GLOBALS ================= */
let points = [];
let hull = [];
let index = 0;

const boat = L.marker(BASE).addTo(map);

/* ================= ADD POINT ================= */
function addPoint() {
  const lat = parseFloat(latInput.value);
  const lng = parseFloat(lngInput.value);
  if (isNaN(lat) || isNaN(lng)) return alert("Invalid");

  points.push([lat, lng]);
  L.marker([lat, lng]).addTo(map);
}

/* ================= QUICK HULL ================= */
function quickHull(pts) {
  if (pts.length < 3) return pts;

  const cross = (o, a, b) =>
    (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);

  let left = pts.reduce((a,b)=>a[1]<b[1]?a:b);
  let right = pts.reduce((a,b)=>a[1]>b[1]?a:b);
  let hull = [];

  function build(a,b,set) {
    let idx=-1, dist=0;
    set.forEach((p,i)=>{
      let d=Math.abs(cross(a,b,p));
      if(d>dist){idx=i;dist=d;}
    });
    if(idx===-1){ hull.push(a); return; }
    let p=set[idx];
    build(a,p,set.filter(q=>cross(a,p,q)>0));
    build(p,b,set.filter(q=>cross(p,b,q)>0));
  }

  build(left,right,pts.filter(p=>cross(left,right,p)>0));
  build(right,left,pts.filter(p=>cross(right,left,p)>0));
  return hull;
}

/* ================= START ================= */
function startMission() {
  hull = quickHull(points);
  L.polygon(hull,{color:'#38bdf8'}).addTo(map);
  index = 0;
  document.getElementById("status").innerText="Status: RUNNING";

  fetch("/mission/start", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ base:BASE, points:hull })
  });

  moveBoat();
}

/* ================= MOVE ================= */
function moveBoat() {
  if(index>=hull.length){
    document.getElementById("status").innerText="Returning to base";
    animateMove(BASE,()=>{
      fetch("/mission/complete",{method:"POST"});
      document.getElementById("status").innerText="Status: COMPLETE";
    });
    return;
  }
  animateMove(hull[index],()=>{ index++; moveBoat(); });
}

/* ================= ANIMATION ================= */
function animateMove(target, done) {
  let start = boat.getLatLng();
  let step = 0;

  const timer = setInterval(()=>{
    step+=0.02;
    if(step>=1){
      clearInterval(timer);
      boat.setLatLng(target);
      if(done) done();
      return;
    }
    boat.setLatLng([
      start.lat+(target[0]-start.lat)*step,
      start.lng+(target[1]-start.lng)*step
    ]);
  },100);
}
</script>

</body>
</html>
