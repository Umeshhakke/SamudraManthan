<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boat Monitoring System</title>

<style>
:root{
  --bg:#EFFAFD;
  --primary:#4A8BDF;
  --alert:#A0006D;
  --ok:#2ECC71;
  --offline:#9CA3AF;
  --text:#0A2540;
}

body{
  margin:0;
  font-family:Segoe UI, system-ui;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:var(--primary);
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:600;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.container{
  padding:20px;
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  justify-content:center;
}

.card{
  background:white;
  width:240px;
  padding:16px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
  position:relative;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.status{
  display:flex;
  align-items:center;
  font-weight:600;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  margin-right:8px;
}

.online{ background:var(--ok); }
.offline{ background:var(--offline); }

.alert{
  position:absolute;
  top:12px;
  right:12px;
  background:var(--alert);
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  font-weight:700;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:.4}
}

.info{
  margin-top:10px;
  font-size:14px;
}

.btn{
  display:block;
  margin-top:14px;
  background:var(--primary);
  color:white;
  text-align:center;
  padding:10px;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
}

.btn:hover{ background:#356ac3; }

.empty{
  margin-top:40px;
  font-size:18px;
  color:#6b7280;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">
🚤 Boat Monitoring Dashboard
</div>

<div class="container">

{% if boats|length == 0 %}
  <div class="empty">No boats are currently online</div>
{% endif %}

{% for id, boat in boats.items() %}
  <div class="card">

    {% if boat.oil %}
      <div class="alert">OIL SPILL</div>
    {% elif boat.waste %}
      <div class="alert">WASTE</div>
    {% endif %}

    <div class="status">
      <div class="dot {{ 'online' if boat.online else 'offline' }}"></div>
      Boat ID: {{ id }}
    </div>

    <div class="info">
      <b>Last Update:</b><br>
      {{ boat.time }}
    </div>

    <a class="btn" href="/boat/{{ id }}">Open Dashboard →</a>
  </div>
{% endfor %}

</div>

</body>
</html>
